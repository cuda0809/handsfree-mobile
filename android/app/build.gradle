plugins {
    id 'com.android.application'
}

def releaseStoreFile = project.findProperty('HF_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('HF_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('HF_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('HF_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def handsFreeAppUrl = project.findProperty('HF_APP_URL') ?: 'https://handsfree-mobile-alpha-02.vercel.app/kmt-sa2/?app=mobile'

android {
    namespace 'com.handsfree.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.handsfree.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"' + handsFreeAppUrl + '"'
        manifestPlaceholders = [appLabel: '핸즈프리 REAL']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: '핸즈프리 REAL Preview']
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}
