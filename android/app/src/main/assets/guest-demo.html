<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>케이엠텍 생산관리 프로토 · 게스트 데모</title>
<style>
:root{--ink:#17323a;--muted:#6b7f84;--line:#e1e8e6;--green:#176956;--bg:#f2f5f3;--orange:#b5652b;--navy:#143d4a;--red:#aa4336}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}.app{max-width:520px;margin:auto;min-height:100dvh;background:#fbfcfb;padding-bottom:96px}
.top{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--green);font-size:13px}
.brand b{display:block;font-size:16px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px;background:#fff1dd;color:#a85b13;white-space:nowrap}
.expiry{margin:12px 18px 0;padding:10px 12px;border:1px solid #ead9bf;background:#fffaf1;border-radius:12px;font-size:11px;display:flex;justify-content:space-between;gap:8px}
main{padding:18px}.date{font-size:12px;color:var(--muted)}h1{font-size:27px;margin:7px 0 7px;letter-spacing:-1.2px}.lead{font-size:13px;color:var(--muted);margin:0 0 16px}
.hero{background:linear-gradient(145deg,#163d39,#21584f);color:#fff;border-radius:19px;padding:18px}.hero small{color:#b7ddd1;letter-spacing:1px}.hero h2{font-size:17px;margin:9px 0 12px;line-height:1.5}.hero b{color:#d5f2e7}.hero-row{display:flex;gap:8px;flex-wrap:wrap}.hero-chip{border:1px solid #ffffff24;padding:7px 9px;border-radius:10px;font-size:11px;background:#ffffff08}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:17px 0;padding-bottom:17px;border-bottom:1px solid var(--line)}.metric{border:0;background:none;text-align:left;padding:0 12px;border-right:1px solid var(--line)}.metric:first-child{padding-left:0}.metric:last-child{border-right:0}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font-size:25px;display:block;margin-top:4px}.metric span{font-size:10px;color:var(--muted);font-weight:400}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:15px 0 10px}.section-head h3{margin:0;font-size:16px}.section-head span{font-size:10px;color:var(--muted)}
.card{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:0 0 9px}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:9px;padding:4px 6px;border-radius:5px;background:#eef5ef;color:var(--green);font-weight:800}.tag.warn{background:#fff0e8;color:var(--orange)}.tag.red{background:#fbeceb;color:var(--red)}.card h3{font-size:15px;margin:9px 0 5px}.card p{font-size:12px;line-height:1.5;color:#52686f;margin:0}.next{margin-top:10px;padding-top:9px;border-top:1px solid #edf1ef;font-size:11px;color:var(--green);font-weight:700;display:flex;justify-content:space-between}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.plan{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.plan small{font-size:10px;color:var(--muted)}.plan b{display:block;font-size:15px;margin:7px 0}.plan p{font-size:11px;color:#61747a;margin:0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px max(11px,env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(10px);z-index:5}.bottom button{border:0;background:none;color:#7e8c89;font-size:10px;padding:5px}.bottom button.active{color:var(--green);font-weight:900}.ico{display:block;font-size:21px;height:25px}
.notice{background:#eef4f2;border:1px solid #dbe6e2;border-radius:13px;padding:12px;font-size:11px;line-height:1.55;color:#53696f}
.empty{padding:35px 5px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#10282f66;display:none;align-items:flex-end;z-index:9}.modal.show{display:flex}.sheet{width:min(100%,520px);margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:80dvh;overflow:auto}.sheet h2{margin:2px 0 8px}.sheet p{font-size:12px;color:#586d73;line-height:1.55}.close{width:100%;border:0;background:#17323a;color:#fff;border-radius:12px;padding:12px;font-weight:800;margin-top:12px}
.expired{display:none;padding:36px 22px;text-align:center}.expired h1{font-size:24px}.expired p{color:var(--muted);line-height:1.6}.expired.show{display:block}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand"><div class="logo">KMT</div><div><b>케이엠텍 생산관리 프로토</b><small>HandsFree REAL · 경진대회 데모</small></div></div>
    <span class="badge">GUEST · 조회전용</span>
  </div>
  <div class="expiry"><span>게스트 사용기한</span><b id="expiryText">2026.10.11 10:30</b></div>
  <main id="main"></main>
  <nav class="bottom">
    <button id="n-today" class="active" onclick="showPage('today')"><span class="ico">⌂</span>오늘</button>
    <button id="n-plan" onclick="showPage('plan')"><span class="ico">▦</span>계획</button>
    <button id="n-project" onclick="showPage('project')"><span class="ico">▤</span>프로젝트</button>
    <button id="n-issue" onclick="showPage('issue')"><span class="ico">!</span>오늘 이슈</button>
  </nav>
</div>
<section class="expired" id="expired">
  <h1>게스트 사용기간이 종료되었습니다</h1>
  <p>이 경진대회 제출용 게스트 데모는 2026년 10월 11일 오전 10:30까지 제공됩니다.</p>
</section>
<div class="modal" id="modal" onclick="if(event.target===this)closeDetail()"><div class="sheet" id="sheet"></div></div>
<script>
const END=Date.parse('2026-10-11T10:30:00+09:00');
const data=[
 {id:'KMT-2026-AMP20K',customer:'데모 프로젝트',model:'AMP 20K',state:'출고 대기',next:'출고 일정 확인',tone:'warn',process:'검수 완료',due:'10/04',issue:'최종 포장 및 출고일 확인'},
 {id:'KMT-2026-KRM100D',customer:'내부 개선',model:'KRM-100D',state:'프로그램 수정 대기',next:'ADC 방식 검토',tone:'red',process:'프로그램',due:'10/06',issue:'갭 세팅 기준 일원화 검토'},
 {id:'KMT-2026-KRM80',customer:'샘플 장비',model:'KRM-80',state:'검수 대기',next:'검수 기준 확인',tone:'green',process:'조립 완료',due:'10/08',issue:'최종 검수 예정'}
];
function expired(){return Date.now()>=END}
function fmtRemain(){const ms=Math.max(0,END-Date.now());const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000);return d+'일 '+h+'시간 남음'}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function card(x,i){const c=x.tone==='red'?'red':x.tone==='warn'?'warn':'';return '<button class="card" onclick="detail('+i+')"><div class="card-top"><span class="tag '+c+'">'+esc(x.process)+'</span><span style="font-size:10px;color:#7b8b8e">'+esc(x.id)+'</span></div><h3>'+esc(x.model)+' · '+esc(x.state)+'</h3><p>'+esc(x.issue)+'</p><div class="next"><span>다음 행동 · '+esc(x.next)+'</span><span>›</span></div></button>'}
function nav(page){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+page).classList.add('active')}
function today(){
 const urgent=data.filter(x=>x.tone==='red').length,wait=data.filter(x=>/대기/.test(x.state)).length;
 main.innerHTML='<div class="date">'+new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})+'</div><h1>오늘의 생산 현황</h1><p class="lead">현장 판단에 필요한 정보만 한 화면에 모았습니다.</p><section class="hero"><small>✳ GROW · 현장 브리핑</small><h2>현재 관리 이슈 <b>'+data.length+'건</b> · 우선 확인 '+urgent+'건</h2><div class="hero-row"><span class="hero-chip">게스트 데모</span><span class="hero-chip">조회 전용</span><span class="hero-chip">'+fmtRemain()+'</span></div></section><div class="metrics"><button class="metric"><small>대기</small><strong>'+wait+'<span>건</span></strong></button><button class="metric"><small>우선</small><strong>'+urgent+'<span>건</span></strong></button><button class="metric"><small>전체</small><strong>'+data.length+'<span>건</span></strong></button></div><div class="section-head"><h3>현재 관리 상세</h3><span>'+data.length+'건</span></div>'+data.map(card).join('')+'<div class="notice">이 설치본은 경진대회 심사용 10일 게스트 데모입니다. 실제 운영 DB 수정 기능은 차단되어 있으며 화면·흐름 확인용으로 제공됩니다.</div>';
}
function plan(){
 main.innerHTML='<h1>계획</h1><p class="lead">JOB NO. 기준 계획과 현재 진행을 함께 확인합니다.</p><div class="plan-grid">'+data.map((x,i)=>'<button class="plan" onclick="detail('+i+')"><small>'+esc(x.id)+'</small><b>'+esc(x.model)+'</b><p>납기 '+esc(x.due)+'<br>현재 '+esc(x.state)+'</p></button>').join('')+'</div><div class="notice" style="margin-top:14px">게스트 데모에서는 일정 변경 기능이 비활성화되어 있습니다.</div>';
}
function project(){
 main.innerHTML='<h1>프로젝트</h1><p class="lead">한 장비의 계획 · 현재상태 · 이슈를 JOB NO.로 연결합니다.</p>'+data.map(card).join('');
}
function issue(){
 main.innerHTML='<h1>오늘 이슈</h1><p class="lead">지연·대기·점검 필요 항목을 우선 표시합니다.</p>'+data.filter(x=>x.tone!=='green').map((x)=>card(x,data.indexOf(x))).join('')+'<div class="notice">입력·수정·Event 저장은 게스트 계정에서 차단됩니다.</div>';
}
function showPage(p){if(expired())return enforceExpiry();nav(p);({today,plan,project,issue})[p]()}
function detail(i){const x=data[i];sheet.innerHTML='<small>'+esc(x.id)+'</small><h2>'+esc(x.model)+'</h2><p><b>현재 상태</b><br>'+esc(x.state)+'</p><p><b>현재 공정</b><br>'+esc(x.process)+'</p><p><b>이슈</b><br>'+esc(x.issue)+'</p><p><b>다음 행동</b><br>'+esc(x.next)+'</p><p><b>납기</b><br>'+esc(x.due)+'</p><div class="notice">게스트는 조회만 가능합니다. 실제 운영본에서는 권한에 따라 Event 기록 및 상태 변경이 연결됩니다.</div><button class="close" onclick="closeDetail()">닫기</button>';modal.classList.add('show')}
function closeDetail(){modal.classList.remove('show')}
function enforceExpiry(){if(!expired())return;document.getElementById('app').classList.add('hidden');document.getElementById('expired').classList.add('show')}
function tick(){if(expired())enforceExpiry();else expiryText.textContent='2026.10.11 10:30 · '+fmtRemain()}
enforceExpiry();if(!expired())today();tick();setInterval(tick,60000);
</script>
</body></html>
