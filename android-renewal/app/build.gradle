plugins {
    id 'com.android.application'
}

def releaseStoreFile = project.findProperty('HF_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('HF_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('HF_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('HF_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def handsFreeAppUrl = project.findProperty('HF_APP_URL') ?: 'https://handsfree-mobile-alpha-02-git-codex-hybrid-eef38f-cuda0809-8210.vercel.app/handsfree-hybrid05-core/'

android {
    namespace 'com.handsfree.renewal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.handsfree.hybrid05'
        minSdk 26
        targetSdk 35
        versionCode 500
        versionName '0.5.0'
        buildConfigField 'String', 'APP_URL', '"' + handsFreeAppUrl + '"'
        manifestPlaceholders = [appLabel: '핸즈프리 H05']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: '핸즈프리 H05']
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}
