<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12345b">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../handsfree-renewal/icon.svg">
  <link rel="stylesheet" href="./desktop.css">
  <title>HandsFree PC</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="../handsfree-renewal/kmt-mobile-logo.png" alt="케이엠텍"><div><b>HandsFree PC</b><span>생산 운영 프로그램</span></div></div>
      <nav aria-label="주 메뉴">
        <button class="nav active" data-view="dashboard">오늘 판단</button>
        <button class="nav" data-view="projects">프로젝트</button>
        <button class="nav" data-view="delivery">납기·일정</button>
        <button class="nav" data-view="history">업무이력</button>
      </nav>
      <div class="connection"><i id="connectionDot"></i><div><b id="connectionTitle">연결 확인 중</b><span id="connectionDetail">운영DB를 읽고 있습니다</span></div></div>
      <p class="version">PC Preview 0.2 · 2026.09.30</p>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div><p class="eyebrow">KMT PRODUCTION CONTROL</p><h1 id="pageTitle">오늘 판단</h1></div>
        <div class="top-actions"><span id="mobileMode" hidden>휴대폰 조회 모드</span><button id="refreshButton">새로고침</button><button id="installButton" hidden>PC에 설치</button><button id="userButton">사용자 연결</button></div>
      </header>
      <section id="statusBar" class="statusbar">운영DB 연결 상태를 확인하고 있습니다.</section>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="detailDialog"><div id="detailBody"></div></dialog>
  <dialog id="authDialog">
    <form id="authForm" class="modal-card">
      <div class="modal-head"><div><p class="eyebrow">PERSONAL ACCESS</p><h2>사용자 연결</h2></div><button type="button" class="close" data-close>×</button></div>
      <p>등록된 이름과 숫자 4자리 PIN으로 연결합니다.</p>
      <label>이름<input id="authName" autocomplete="name" required></label>
      <label>PIN<input id="authPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label>
      <p id="authHint" class="hint"></p>
      <button class="primary" type="submit">연결</button>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <script src="./desktop.js"></script>
</body>
</html>
