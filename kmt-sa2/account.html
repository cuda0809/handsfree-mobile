<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandsFree 로그인</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#0a1830;color:#fff;font:16px system-ui,sans-serif}main{max-width:430px;margin:4vh auto;padding:24px}h1{font-size:28px}p{line-height:1.6;color:#b9c7dc}label{display:block;margin:16px 0}input{display:block;width:100%;margin-top:8px;padding:14px;border-radius:10px;border:1px solid #47617e;background:#102847;color:#fff;font:inherit}button,a{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:10px;background:#2872eb;color:#fff;text-decoration:none;font:inherit;text-align:center}.secondary{background:#243b57}#status{min-height:30px}.secret-wrap{position:relative}.secret-wrap input{padding-right:75px}.peek{position:absolute;right:6px;top:5px;width:auto;margin:0;padding:10px;background:#243b57;font-size:13px}.kmt-logo-crop{display:block;position:relative;width:94px;height:50px;overflow:hidden;flex-shrink:0;background:white}.kmt-original-logo{display:block;position:absolute;width:148px;height:105px;max-width:none;left:-32px;top:-47px;padding:0;border:0}.kmt-brand{display:flex;align-items:center;gap:11px}.kmt-brand strong{display:block}.kmt-brand small{display:block;font-size:10px}.issue-process-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.issue-process-fields label{min-width:0}.issue-process-fields select{display:block;width:100%;min-height:48px;margin-top:7px;padding:10px 6px;border:1px solid #8798aa;border-radius:8px;background:white;color:#15232d;font:inherit}</style></head><body><main><div class="kmt-brand"><span class="kmt-logo-crop"><img class="kmt-original-logo" alt="케이엠텍 KMT 로고" src="./kmt-approved-logo.png" width="148" height="105"></span><div><strong>케이엠텍</strong><small>HandsFree · 생산관리</small></div></div><small>HANDSFREE · MOBILE26.5</small><h1 id="heading">로그인</h1><p id="intro">아이디와 비밀번호를 입력하세요.</p><p id="status" role="status"></p><form id="accountForm">
<label id="nameField" hidden>이름<input id="displayName" autocomplete="name" maxlength="30" placeholder="사내 등록 이름"></label>
<label>아이디<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required placeholder="아이디"></label>
<label><span id="passwordLabel">비밀번호</span><div class="secret-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" class="peek" data-secret="password">보기</button></div></label>
<div id="newFields" hidden><label id="newPasswordField" hidden>새 비밀번호<input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><label>비밀번호 확인<div class="secret-wrap"><input id="confirmPassword" name="passwordConfirmation" type="password" autocomplete="new-password" maxlength="128" aria-describedby="passwordMatch"><button type="button" class="peek" data-secret="confirmPassword">보기</button></div></label><p id="passwordMatch" role="status" aria-live="polite"></p><p>비밀번호는 10자 이상입니다. 가입은 담당자 확인 후 사용할 수 있습니다. 이메일은 필요하지 않습니다.</p></div>
<button id="submit" type="submit">로그인</button></form><button id="signupMode" class="secondary">회원가입</button><button id="loginMode" class="secondary" hidden>로그인으로 돌아가기</button><button id="changeMode" class="secondary" hidden>비밀번호 변경</button><button id="logout" class="secondary" hidden>로그아웃</button><a id="returnApp" href="/kmt-sa2/" hidden>앱으로 돌아가기</a></main><script src="account.js?v=20261030m265"></script></body></html>
