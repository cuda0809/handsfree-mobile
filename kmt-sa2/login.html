<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandsFree 간편 연결</title><style>[hidden]{display:none!important}body{margin:0;background:#0a1830;color:#fff;font:16px system-ui,sans-serif}main{max-width:430px;margin:6vh auto;padding:28px}h1{font-size:28px;margin-bottom:10px}p{line-height:1.6;color:#b9c7dc}label{display:block;margin:16px 0;color:#d9e3f1}input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:14px;border-radius:10px;border:1px solid #47617e;background:#102847;color:#fff;font-size:18px}button,a{display:block;width:100%;box-sizing:border-box;padding:14px 18px;margin:10px 0;border:0;border-radius:10px;background:#2872eb;color:white;text-decoration:none;font:inherit;text-align:center}.secondary{background:#243b57}#status{min-height:50px}.pin{letter-spacing:8px;text-align:center;font-size:24px}.secret-wrap{position:relative}.secret-wrap input{padding-right:78px}.peek{position:absolute;right:8px;top:8px;width:auto;margin:0;padding:8px 10px;border-radius:8px;background:#243b57;font-size:13px}</style></head><body><main data-login-build="fast2"><small>HANDSFREE 개인 연결 · MOBILE24</small><h1>간편 연결</h1><p>이름과 PIN으로 연결합니다. 개인 계정은 최초 등록 후 자동 로그인을 유지합니다.</p><p id="status" role="status">바로 입력할 수 있습니다. 기존 연결 상태도 확인 중입니다.</p>
<section id="setup"><div id="memberModes" hidden><button id="memberLoginMode" type="button" class="secondary">개인 로그인</button><button id="memberEnrollMode" type="button" class="secondary">처음 등록 · 초대코드</button></div>
<label>내 이름<input id="displayName" type="text" maxlength="30" autocomplete="name" placeholder="이름 입력"></label>
<label><span id="pinLabel">4자리 PIN</span><div class="secret-wrap"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder="••••"><button class="peek" type="button" data-secret="pin">보기</button></div></label>
<div id="enrollFields" hidden><label>개별 초대코드<input id="inviteCode" type="text" maxlength="48" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><label>개인 PIN 다시 입력<input id="confirmPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><p>초대코드는 한 번만 사용됩니다. 개인 PIN은 다른 사람과 공유하지 마세요.</p></div><button id="activateBtn">연결</button>
</section>
<button id="logout" class="secondary" hidden>이 기기 연결 해제</button><a href="/kmt-sa2/">HandsFree로 돌아가기</a></main><script src="login.js?v=20261019-members"></script></body></html>
