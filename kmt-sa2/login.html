<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandsFree 간편 연결</title><style>[hidden]{display:none!important}body{margin:0;background:#0a1830;color:#fff;font:16px system-ui,sans-serif}main{max-width:430px;margin:6vh auto;padding:28px}h1{font-size:28px;margin-bottom:10px}p{line-height:1.6;color:#b9c7dc}label{display:block;margin:16px 0;color:#d9e3f1}input,select{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:14px;border-radius:10px;border:1px solid #47617e;background:#102847;color:#fff;font-size:18px}button,a{display:block;width:100%;box-sizing:border-box;padding:14px 18px;margin:10px 0;border:0;border-radius:10px;background:#2872eb;color:white;text-decoration:none;font:inherit;text-align:center}.secondary{background:#243b57}.quiet{background:transparent;border:1px solid #36506d}#status{min-height:50px}.pin{letter-spacing:8px;text-align:center;font-size:24px}.secret-wrap{position:relative}.secret-wrap input{padding-right:78px}.peek{position:absolute;right:8px;top:8px;width:auto;margin:0;padding:8px 10px;border-radius:8px;background:#243b57;font-size:13px}</style></head><body><main><small>HANDSFREE SIMPLE PIN · SA2.3</small><h1>간편 연결</h1><p>처음 한 번만 이름과 4자리 PIN을 정하면 됩니다. 이후에는 자동 연결됩니다.</p><p id="status" role="status">연결 상태를 확인하는 중…</p>
<section id="setup" hidden>
<label>내 이름<input id="displayName" type="text" maxlength="30" autocomplete="name" placeholder="이름 입력"></label>
<label id="accountWrap" hidden>사용자 계정<select id="profileSelect"></select></label>
<label>4자리 PIN<div class="secret-wrap"><input id="newPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder="••••"><button class="peek" type="button" data-secret="newPin">보기</button></div></label>
<button id="activateBtn">연결</button><p>PIN 원문은 서버나 앱 코드에 저장하지 않습니다.</p>
</section>
<section id="pinLogin" hidden><div id="pinName"></div><label>4자리 PIN<div class="secret-wrap"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" placeholder="••••"><button class="peek" type="button" data-secret="pin">보기</button></div></label><button id="pinBtn">연결</button><button id="resetBtn" class="quiet">다른 이름으로 다시 등록</button></section>
<button id="logout" class="secondary" hidden>이 기기 연결 해제</button><a href="/kmt-sa2/">HandsFree로 돌아가기</a></main><script src="login.js?v=sa23"></script></body></html>
