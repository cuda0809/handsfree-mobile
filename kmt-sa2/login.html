<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandsFree WEB · 로그인</title><link rel="icon" href="./icon.svg"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#edf2f8;color:#183149;font:16px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.login-shell{width:min(100%,960px);display:grid;grid-template-columns:1fr 1fr;background:white;border:1px solid #dce4ef;border-radius:22px;overflow:hidden;box-shadow:0 22px 65px #17355710}.intro{padding:48px 38px;background:#173956;color:white;display:flex;flex-direction:column;justify-content:space-between}.logo{width:148px;background:#fff;padding:12px;border-radius:10px}.intro small{display:block;letter-spacing:2px;color:#bcd5ef;margin-top:20px}.intro h1{font-size:38px;line-height:1.3;letter-spacing:-1.5px;margin:28px 0 18px}.intro p{line-height:1.8;color:#c5d8e8}.intro footer{font-size:12px;line-height:1.8;color:#a9bfd0;margin-top:36px}main{padding:42px 36px}main>small{font-size:12px;color:#205bbb;font-weight:800;letter-spacing:1px}h2{font-size:27px;margin:14px 0}main p{font-size:14px;color:#65788b;line-height:1.65}label{display:block;margin:20px 0 8px;font-size:14px;font-weight:650}input{width:100%;margin-top:8px;border:1px solid #cfd9e5;border-radius:10px;padding:14px;font:inherit;background:#fafcfe;color:#183149}input:focus{outline:2px solid #205bbb;outline-offset:2px}.pin{letter-spacing:7px}.secret-wrap{position:relative}.secret-wrap input{padding-right:70px}.peek{position:absolute;right:8px;top:16px;border:0;border-radius:6px;padding:8px;background:#edf2f8;color:#355174}button,a{font:inherit}#activateBtn,#continueBtn,#logout{width:100%;padding:14px;border:0;border-radius:10px;margin:20px 0 8px;background:#205bbb;color:white;cursor:pointer;text-align:center;text-decoration:none;display:block}#logout{background:#edf2f8;color:#355174}button:disabled{opacity:.6;cursor:wait}#status{min-height:54px;padding:12px;background:#f2f6fb;border-radius:9px;font-size:13px;overflow-wrap:anywhere}.note{font-size:12px;color:#718398}.back{font-size:13px;display:inline-block;color:#426c9b;margin-top:15px}@media(max-width:680px){body{padding:16px;display:block}.login-shell{grid-template-columns:1fr;max-width:460px;margin:12px auto}.intro{padding:24px}.logo{width:112px}.intro h1{font-size:25px;margin:16px 0 4px}.intro p,.intro footer{display:none}.intro small{margin-top:14px}main{padding:26px 24px}h2{font-size:24px}}
</style></head><body><div class="login-shell"><aside class="intro"><div><img class="logo" src="./kmt-approved-logo.png" alt="케이엠텍 KMT 로고"><small>HANDSFREE WEB 01</small><h1>현장의 흐름을,<br>한눈에.</h1><p>오늘 계획부터 장비별 진행과 이력까지.<br>PC와 휴대폰에서 같은 업무를 이어갑니다.</p></div><footer>현재 앱을 보존한 웹 복사본입니다.<br>로그인 후 저장하는 내용은 실제 업무 기록에 반영됩니다.</footer></aside><main data-login-build="web1"><small>케이엠텍 · 생산관리</small><h2>웹 로그인</h2><p>기존 이름과 4자리 PIN으로 연결하세요.<br>설치 없이 브라우저에서 바로 사용합니다.</p><p id="status" role="status" aria-live="polite">기존 연결을 확인하고 있습니다.</p><form id="setup"><label for="displayName">이름<input id="displayName" type="text" maxlength="30" autocomplete="username" placeholder="이름 입력" required></label><label for="pin">4자리 PIN</label><div class="secret-wrap"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="••••" required><button class="peek" type="button" data-secret="pin" aria-pressed="false">보기</button></div><button id="activateBtn" type="submit">로그인하고 시작</button></form><a id="continueBtn" href="./" hidden>업무 화면 열기</a><button id="logout" type="button" hidden>이 브라우저 연결 해제</button><p class="note">연결 정보는 이 브라우저에 유지됩니다. 공용 PC에서는 사용 후 연결을 해제하세요.</p></main></div><script src="./login.js?v=20261022web1"></script></body></html>
