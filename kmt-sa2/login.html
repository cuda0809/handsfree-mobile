<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandsFree 로그인</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#0a1830;color:#fff;font:16px system-ui,sans-serif}main{max-width:430px;margin:4vh auto;padding:24px}h1{font-size:28px}p{line-height:1.6;color:#b9c7dc}label{display:block;margin:16px 0}input{display:block;width:100%;margin-top:8px;padding:14px;border-radius:10px;border:1px solid #47617e;background:#102847;color:#fff;font:inherit}button,a{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:10px;background:#2872eb;color:#fff;text-decoration:none;font:inherit;text-align:center}.secondary{background:#243b57}#status{min-height:30px}.secret-wrap{position:relative}.secret-wrap input{padding-right:75px}.peek{position:absolute;right:6px;top:5px;width:auto;margin:0;padding:10px;background:#243b57;font-size:13px}</style></head><body><main><small>HANDSFREE · MOBILE26.4</small><h1 id="heading">로그인</h1><p id="intro">아이디와 비밀번호를 입력하세요.</p><p id="status" role="status"></p><form id="accountForm">
<label id="nameField" hidden>이름<input id="displayName" autocomplete="name" maxlength="30" placeholder="사내 등록 이름"></label>
<label>아이디<input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required placeholder="아이디"></label>
<label><span id="passwordLabel">비밀번호</span><div class="secret-wrap"><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" class="peek" data-secret="password">보기</button></div></label>
<div id="newFields" hidden><label id="newPasswordField" hidden>새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><label>비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128"></label><p>비밀번호는 10자 이상입니다. 가입은 담당자 확인 후 사용할 수 있습니다. 이메일은 필요하지 않습니다.</p></div>
<button id="submit" type="submit">로그인</button></form><button id="signupMode" class="secondary">회원가입</button><button id="loginMode" class="secondary" hidden>로그인으로 돌아가기</button><button id="changeMode" class="secondary" hidden>비밀번호 변경</button><button id="logout" class="secondary" hidden>로그아웃</button><a id="returnApp" href="/kmt-sa2/" hidden>앱으로 돌아가기</a></main><script src="login.js?v=20261026m264"></script></body></html>
