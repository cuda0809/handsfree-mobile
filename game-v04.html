<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#09121d"><title>Grow × Emotion · 3D Playtest 0.4</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09111b;color:#edf5ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}canvas{position:fixed;inset:0;touch-action:none}.hud{position:fixed;z-index:5}.panel{background:rgba(7,13,22,.76);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(9px);box-shadow:0 9px 30px rgba(0,0,0,.25)}#status{left:10px;top:calc(env(safe-area-inset-top) + 8px);width:min(54vw,245px);padding:9px 11px;border-radius:14px}.row{display:flex;justify-content:space-between;gap:8px;font-size:11px}.row strong{font-size:13px}.bar{height:6px;margin-top:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.fill{height:100%;width:100%}#hp{background:linear-gradient(90deg,#ff6578,#ffae86)}#mp{background:linear-gradient(90deg,#4eb7ff,#78e8ff)}#xp{background:linear-gradient(90deg,#71efa0,#dbff8f)}#quest{right:10px;top:calc(env(safe-area-inset-top) + 8px);width:min(42vw,220px);padding:9px 11px;border-radius:14px;font-size:11px;line-height:1.45}#toast{left:50%;top:calc(env(safe-area-inset-top) + 108px);transform:translateX(-50%);padding:8px 13px;border-radius:999px;opacity:0;transition:.18s;font-size:11px;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1}.pad{position:absolute;border-radius:50%;touch-action:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);pointer-events:auto}#movePad{left:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:122px;height:122px}#viewPad{right:16px;bottom:calc(env(safe-area-inset-bottom) + 112px);width:102px;height:102px;border-style:dashed;background:rgba(80,1 px;line-height:1.4;color:#a8b6c8}.primary{width:100%;padding:14px;border:0;border-radius:15px;background:linear-gradient(135deg,#5bcaff,#89efbd);font-weight:900;color:#07121a;font-size:14px}.note{margin-top:12px;padding:11px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:11px;line-height:1.55;color:#b3c1d3}.note b{color:#eef6ff}@media(max-width:430px){.roles{grid-template-columns:1fr}.role{min-height:auto}#movePad{width:112px;height:112px}#movePad .knob{left:29px;top:29px}#viewPad{width:92px;height:92px}#viewKnob{left:26px;top:26px}#actions{transform:scale(.91);transform-origin:right bottom;right:6px}}</style></head><body><div id="status" class="hud panel"><div class="row"><strong id="name">Lv.1 유랑검객</strong><span id="weapon">수련검</span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="bar"><div id="mp" class="fill"></div></div><div class="bar"><div id="xp" class="fill"></div></div></div><div id="quest" class="hud panel"><b>현재 목표</b><br><span id="questText">아린에게 말을 걸어보자.</span></div><div id="toast" class="hud panel"></div><div id="movePad" class="hud pad"><div id="moveKnob" class="knob"></div></div><div id="moveLabel" class="hud label">이동 / 방향</div><div id="viewPad" class="hud pad"><div id="viewKnob" class="knob"></div></div><div id="viewLabel" class="hud label">시점</div><div id="actions" class="hud"><button id="skill" class="act">회전베기</button><button id="talk" class="act">상호작용</button><button id="atk" class="act">공격</button></div><div id="start"><div class="card"><div class="brand">GROW × EMOTION · 3D MOBILE PLAYTEST 0.4</div><h1>온라인 RPG식 조작으로 바꿨다.</h1><p>왼쪽은 <b>캐릭터 이동·방향</b>, 오른쪽 위 작은 패드는 <b>카메라 시점 회전</b> 전용이다. 검은 오른손 손바닥 계층에 고정해 팔과 함께 움직인다.</p><div class="roles"><button class="role sel" data-role="wanderer"><strong>유랑검객</strong><small>균형형 · 기력 · 검술</small></button><button class="role" data-role="vanguard"><strong>선봉전사</strong><small>체력형 · 분노 · 강공</small></button><button class="role" data-role="weaver"><strong>비전술사</strong><small>기술형 · 마나 · 범위기</small></button></div><button id="startBtn" class="primary">0.4 플레이 시작</button><div class="note"><b>왼손:</b> 이동/방향<br><b>오른손:</b> 시점 회전 + 공격/스킬<br><b>핵심:</b> 캐릭터 방향과 카메라 방향은 독립</div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">import * as THREE from 'three';const $=s=>document.querySelector(s),ui={start:$('#start'),name:$('#name'),weapon:$('#weapon'),hp:$('#hp'),mp:$('#mp'),xp:$('#xp'),quest:$('#questText'),toast:$('#toast'),movePad:$('#movePad'),moveKnob:$('#moveKnob'),viewPad:$('#viewPad'),viewKnob:$('#viewKnob')};const roles={wanderer:{name:'유랑검객',hp:120,mp:100,atk:16,speed:5,color:0x3e9fc1,range:2.8},vanguard:{name:'선봉전사',hp:155,mp:82,atk:20,speed:4.5,color:0xb75d50,range:2.5},weaver:{name:'비전술사',hp:100,mp:130,atk:14,speed:4.8,color:0x8c6fe0,range:3.3}};let role='wanderer',running=false,camYaw=Math.PI*.82,camPitch=.47,camDist=8.6,player={level:1,xp:0,xpNeed:80,hp:120,maxHp:120,mp:100,maxMp:100,atk:16,speed:5,atkCd:0,skillCd:0,quest:0,qkills:0};const scene=new THREE.Scene();scene.background=new THREE.Color(0x93adc0);scene.fog=new THREE.Fog(0x93adc0,20,58);const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,120),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdfefff,0x31422d,1.9));const sun=new THREE.DirectionalLight(0xfff2d4,2.4);sun.position.set(-10,18,10);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,52),new THREE.MeshStandardMaterial({color:0x4c7550,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(7,34),new THREE.MeshStandardMaterial({color:0x867661,roughness:1}));road.rotation.x=-Math.PI/2;road.position.set(0,.015,3);scene.add(road);function box(x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c,roughness:.86}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function house(x,z,c){box(x,1.5,z,5,3,4,c);const r=new THREE.Mesh(new THREE.ConeGeometry(3.3,1.8,4),new THREE.MeshStandardMaterial({color:0x3b3133}));r.rotation.y=Math.PI/4;r.position.set(x,3.9,z);scene.add(r)}house(-7,7,0x695647);house(7,7,0x564b63);house(-8,-1,0x5d636a);function human(color=0x3e9fc1,hair=0x29211e,s=1){const root=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xd6ae8a,roughness:.9}),cloth=new THREE.MeshStandardMaterial({color,roughness:.8}),dark=new THREE.MeshStandardMaterial({color:0x242c39,roughness:.9});let torso=new THREE.Mesh(new THREE.BoxGeometry(.72,.92,.4),cloth);torso.position.y=1.55;root.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.29,14,12),skin);head.position.y=2.34;root.add(head);let hairCap=new THREE.Mesh(new THREE.SphereGeometry(.305,12,8,0,Math.PI*2,0,Math.PI*.56),new THREE.MeshStandardMaterial({color:hair}));hairCap.position.y=2.43;root.add(hairCap);const legL=new THREE.Group(),legR=new THREE.Group();legL.position.set(-.2,.94,0);legR.position.set(.2,.94,0);root.add(legL,legR);for(const p of [legL,legR]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.72,4,8),dark);l.position.y=-.48;p.add(l)}const left=new THREE.Group(),right=new THREE.Group();left.position.set(-.47,1.86,0);right.position.set(.47,1.86,0);root.add(left,right);for(const p of [left,right]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.5,4,8),cloth);a.position.y=-.34;p.add(a)}const elbow=new THREE.Group();elbow.position.set(0,-.65,0);right.add(elbow);const fore=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.36,4,8),skin);fore.position.y=-.25;elbow.add(fore);const hand=new THREE.Group();hand.position.set(0,-.5,0);elbow.add(hand);hand.add(new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),skin));const sword=new THREE.Group(),grip=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.34,8),new THREE.MeshStandardMaterial({color:0x332a23}));grip.rotation.x=Math.PI/2;sword.add(grip);const guard=new THREE.Mesh(new THREE.BoxGeometry(.36,.055,.07),new THREE.MeshStandardMaterial({color:0xdce8ee,metalness:.7,roughness:.25}));guard.position.z=-.23;sword.add(guard);const blade=new THREE.Mesh(new THREE.BoxGeometry(.095,.045,1.2),guard.material);blade.position.z=-.88;sword.add(blade);hand.add(sword);root.userData={left,right,elbow,hand,sword,legL,legR,walk:0,attackT:0};root.scale.setScalar(s);root.traverse(o=>{if(o.isMesh)o.castShadow=true});return root}function mob(type=0){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:[0x708f50,0x6c7567,0x71475a][type],roughness:.86}),dark=new THREE.MeshStandardMaterial({color:0x25272c});const body=new THREE.Mesh(type===1?new THREE.DodecahedronGeometry(.58):new THREE.CapsuleGeometry(.34,.82,5,10),mat);body.rotation.z=Math.PI/2;body.position.y=.62;g.add(body);const head=new THREE.Mesh(type===1?new THREE.DodecahedronGeometry(.31):new THREE.BoxGeometry(.48,.42,.54),mat);head.position.set(.62,.7,0);g.add(head);const legs=[];for(const x of [-.35,.35])for(const z of [-.23,.23]){const p=new THREE.Group();p.position.set(x,.42,z);const l=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.32,3,6),dark);l.position.y=-.2;p.add(l);g.add(p);legs.push(p)}g.userData={legs,walk:0,type};if(type===2)g.scale.setScalar(1.12);return g}let hero=human(roles[role].color);hero.position.set(-4,0,2);scene.add(hero);const npc=human(0x785e8d,0x49302c,.95);npc.position.set(-3.1,0,-1.2);scene.add(npc);const spawns=[[5,2,0],[8,4,1],[11,1,0],[14,-2,2],[9,-6,1],[15,5,2],[6,-8,0],[13,-8,1],[18,1,2]],enemies=[];function spawn(i){const [x,z,type]=spawns[i];let e=enemies[i];if(!e){e={mesh:mob(type),type,maxHp:52+type*18,hp:52+type*18,alive:true,respawn:0};enemies[i]=e;scene.add(e.mesh)}e.hp=e.maxHp;e.alive=true;e.respawn=0;e.mesh.visible=true;e.mesh.position.set(x+(Math.random()-.5)*1.2,0,z+(Math.random()-.5)*1.2)}spawns.forEach((_,i)=>spawn(i));function toast(t,ms=1500){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.classList.remove('show'),ms)}function refresh(){ui.name.textContent=`Lv.${player.level} ${roles[role].name}`;ui.hp.style.width=`${player.hp/player.maxHp*100}%`;ui.mp.style.width=`${player.mp/player.maxMp*100}%`;ui.xp.style.width=`${player.xp/player.xpNeed*100}%`;ui.quest.textContent=player.quest===0?'아린에게 말을 걸어보자.':player.quest===1?`필드 몬스터 처치 ${Math.min(3,player.qkills)}/3${player.qkills>=3?' · 아린에게 돌아가기':''}`:'방향과 시점을 따로 사용해 전투해보자.'}function reset(){const r=roles[role];player={level:1,xp:0,xpNeed:80,hp:r.hp,maxHp:r.hp,mp:r.mp,maxMp:r.mp,atk:r.atk,speed:r.speed,atkCd:0,skillCd:0,quest:0,qkills:0};scene.remove(hero);hero=human(r.color);hero.position.set(-4,0,2);scene.add(hero);refresh()}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('sel',x===b));reset()});$('#startBtn').onclick=()=>{ui.start.style.display='none';running=true;toast('왼쪽=이동/방향 · 오른쪽=시점')};const move={x:0,y:0,id:null},view={x:0,y:0,id:null};function bindPad(el,knob,state){const upd=(x,y)=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,max=r.width*.31,l=Math.hypot(dx,dy)||1,k=Math.min(1,max/l);dx*=k;dy*=k;state.x=dx/max;state.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`};el.onpointerdown=e=>{state.id=e.pointerId;el.setPointerCapture(e.pointerId);upd(e.clientX,e.clientY)};el.onpointermove=e=>{if(e.pointerId===state.id)upd(e.clientX,e.clientY)};const end=e=>{if(e.pointerId===state.id){state.id=null;state.x=state.y=0;knob.style.transform='translate(0,0)'}};el.onpointerup=end;el.onpointercancel=end}bindPad(ui.movePad,ui.moveKnob,move);bindPad(ui.viewPad,ui.viewKnob,view);function nearest(range=2.5){let best=null,bd=range;for(const e of enemies)if(e.alive){const d=hero.position.distanceTo(e.mesh.position);if(d<bd){bd=d;best=e}}return best}function hit(e,d){if(!e)return;e.hp-=d;if(e.hp<=0){e.alive=false;e.mesh.visible=false;e.respawn=4+Math.random()*3;player.xp+=27+e.type*5;if(player.quest===1)player.qkills++;toast('몬스터 처치');while(player.xp>=player.xpNeed){player.xp-=player.xpNeed;player.level++;player.xpNeed=Math.round(player.xpNeed*1.35);player.maxHp+=12;player.hp=player.maxHp;toast(`레벨 ${player.level}!`)}refresh()}}function attack(){if(!running||player.atkCd>0)return;player.atkCd=.42;hero.userData.attackT=.3;const e=nearest();if(e){const v=e.mesh.position.clone().sub(hero.position);hero.rotation.y=Math.atan2(v.x,v.z);hit(e,player.atk)}}function skill(){if(!running||player.skillCd>0||player.mp<32){if(player.mp<32)toast('전투 자원 부족');return}player.mp-=32;player.skillCd=1.7;let n=0;for(const e of enemies)if(e.alive&&hero.position.distanceTo(e.mesh.position)<=roles[role].range){hit(e,player.atk*1.55);n++}toast(`회전베기 · ${n} 적중`);refresh()}function talk(){if(hero.position.distanceTo(npc.position)>2){toast('아린에게 더 가까이 가자.');return}if(player.quest===0){player.quest=1;player.qkills=0;toast('아린: 몬스터 3마리를 정리해줘.')}else if(player.quest===1&&player.qkills>=3){player.quest=2;player.atk+=8;ui.weapon.textContent='월광강 장검';toast('퀘스트 완료 · 월광강 장검 획득')}else toast(`아린: 아직 ${Math.max(0,3-player.qkills)}마리가 남았어.`);refresh()}$('#atk').onpointerdown=attack;$('#skill').onpointerdown=skill;$('#talk').onpointerdown=talk;function heroAnim(dt,moving){const u=hero.userData;if(moving){u.walk+=dt*9;const s=Math.sin(u.walk)*.66;u.legL.rotation.x=s;u.legR.rotation.x=-s;u.left.rotation.x=-s*.4;if(u.attackT<=0)u.right.rotation.x=s*.3}else{u.legL.rotation.x*=.72;u.legR.rotation.x*=.72;u.left.rotation.x*=.72}if(u.attackT>0){u.attackT-=dt;const p=1-u.attackT/.3,s=Math.sin(p*Math.PI);u.right.rotation.x=-1.15*s;u.right.rotation.z=-.45*s;u.elbow.rotation.x=-.65*s}else{u.right.rotation.z*=.65;u.elbow.rotation.x*=.65}}let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(running){player.atkCd=Math.max(0,player.atkCd-dt);player.skillCd=Math.max(0,player.skillCd-dt);player.mp=Math.min(player.maxMp,player.mp+dt*7);camYaw-=view.x*dt*2.1;camPitch=THREE.MathUtils.clamp(camPitch+view.y*dt*.8,.25,.72);let moving=false;if(Math.hypot(move.x,move.y)>.08){moving=true;const f=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)),r=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw)),dir=r.multiplyScalar(move.x).add(f.multiplyScalar(-move.y)).normalize();hero.position.addScaledVector(dir,player.speed*dt);const ty=Math.atan2(dir.x,dir.z);let delta=((ty-hero.rotation.y+Math.PI)%(Math.PI*2))-Math.PI;hero.rotation.y+=delta*Math.min(1,dt*12)}heroAnim(dt,moving);for(let i=0;i<enemies.length;i++){const e=enemies[i];if(!e.alive){e.respawn-=dt;if(e.respawn<=0){spawn(i);toast('몬스터 리젠',700)}continue}const d=hero.position.distanceTo(e.mesh.position);if(d<6&&d>1.35){const dir=hero.position.clone().sub(e.mesh.position).normalize();e.mesh.position.addScaledVector(dir,(1.15+e.type*.13)*dt);e.mesh.rotation.y=Math.atan2(dir.x,dir.z)}}refresh()}const target=hero.position.clone().add(new THREE.Vector3(0,1.25,0)),h=camDist*Math.cos(camPitch),y=camDist*Math.sin(camPitch),desired=target.clone().add(new THREE.Vector3(Math.sin(camYaw)*h,y,Math.cos(camYaw)*h));camera.position.lerp(desired,.12);camera.lookAt(target);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});reset();</script></body></html>
