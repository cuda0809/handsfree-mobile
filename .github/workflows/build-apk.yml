name: Build Competition Guest APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: task/competition-guest10-offline-20261001

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publish APK in public repository
        run: |
          mkdir -p submission
          cp android/app/build/outputs/apk/debug/app-debug.apk submission/KMT_Production_Proto_Competition_Guest10.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/KMT_Production_Proto_Competition_Guest10.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish competition guest APK"
            git push origin HEAD:task/competition-guest10-offline-20261001
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMT-Production-Proto-Competition-Guest10-APK
          path: submission/KMT_Production_Proto_Competition_Guest10.apk
          if-no-files-found: error
