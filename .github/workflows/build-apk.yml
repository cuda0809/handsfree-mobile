name: Build HandsFree APK

on:
  push:
    paths:
      - 'android/**'
      - 'kmt/icon.svg'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "KMT-Production-Proto.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KMT-Production-Proto-APK
          path: KMT-Production-Proto.apk
          if-no-files-found: error
