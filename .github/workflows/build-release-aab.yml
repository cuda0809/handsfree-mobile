name: Build HandsFree Release AAB

on:
  workflow_dispatch:

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate signing secrets
        env:
          HF_RELEASE_KEYSTORE_BASE64: ${{ secrets.HF_RELEASE_KEYSTORE_BASE64 }}
          HF_RELEASE_STORE_PASSWORD: ${{ secrets.HF_RELEASE_STORE_PASSWORD }}
          HF_RELEASE_KEY_ALIAS: ${{ secrets.HF_RELEASE_KEY_ALIAS }}
          HF_RELEASE_KEY_PASSWORD: ${{ secrets.HF_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$HF_RELEASE_KEYSTORE_BASE64"
          test -n "$HF_RELEASE_STORE_PASSWORD"
          test -n "$HF_RELEASE_KEY_ALIAS"
          test -n "$HF_RELEASE_KEY_PASSWORD"

      - name: Restore release keystore
        env:
          HF_RELEASE_KEYSTORE_BASE64: ${{ secrets.HF_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$HF_RELEASE_KEYSTORE_BASE64" | base64 -d > android/handsfree-release.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          HF_RELEASE_STORE_PASSWORD: ${{ secrets.HF_RELEASE_STORE_PASSWORD }}
          HF_RELEASE_KEY_ALIAS: ${{ secrets.HF_RELEASE_KEY_ALIAS }}
          HF_RELEASE_KEY_PASSWORD: ${{ secrets.HF_RELEASE_KEY_PASSWORD }}
        run: >-
          gradle bundleRelease --no-daemon
          -PHF_RELEASE_STORE_FILE=handsfree-release.jks
          -PHF_RELEASE_STORE_PASSWORD="$HF_RELEASE_STORE_PASSWORD"
          -PHF_RELEASE_KEY_ALIAS="$HF_RELEASE_KEY_ALIAS"
          -PHF_RELEASE_KEY_PASSWORD="$HF_RELEASE_KEY_PASSWORD"

      - name: Copy bundle
        run: cp android/app/build/outputs/bundle/release/app-release.aab HandsFree-Mobile-Release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HandsFree-Mobile-Release-AAB
          path: HandsFree-Mobile-Release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android/handsfree-release.jks
