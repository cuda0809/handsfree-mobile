name: Build HandsFree Renewal APK

on:
  push:
    paths:
      - 'android-renewal/**'
      - '.github/workflows/build-renewal-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Renewal debug APK
        working-directory: android-renewal
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-renewal/app/build/outputs/apk/debug/app-debug.apk HandsFree-Renewal-0.10-Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandsFree-Renewal-0.10-Preview-APK
          path: HandsFree-Renewal-0.10-Preview.apk
          if-no-files-found: error

      - name: Publish branch download
        run: |
          mkdir -p downloads
          cp HandsFree-Renewal-0.10-Preview.apk downloads/HandsFree-Renewal-0.10-Preview.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/HandsFree-Renewal-0.10-Preview.apk
          git diff --cached --quiet || git commit -m "Publish Renewal 0.10 Preview APK [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

# Renewal 0.10 Preview build
