<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>케이엠텍 HandsFree</title><meta name="theme-color" content="#205bbb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="케이엠텍"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">

0 23px;border-bottom:1px solid var(--line);padding-bottom:20px}.metric{background:none;border:0;border-right:1px solid var(--line);text-align:left;padding:0 16px}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:27px;display:block;margin-top:5px;letter-spacing:-1px}.metric strong span{font-size:12px;font-weight:400;margin-left:4px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h2{font-size:17px;margin:0;letter-spacing:-.5px}.section-title>span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;margin:0 0 14px}.chip{border:1px solid var(--line);background:white;border-radius:22px;padding:7px 12px;font-size:12px}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}.item{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;transition:transform .15s,box-shadow .15s}.item:hover{transform:translateY(-2px);box-shadow:0 6px 20px #163d3909}.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:10px;background:#f9eee8;color:var(--orange);padding:4px 7px;border-radius:5px;font-weight:650}.tag.green{background:#eaf3ec;color:var(--green)}.category{font-size:11px;color:var(--muted)}.item h3{font-size:16px;margin:11px 0 5px;letter-spacing:-.4px}.item h3 small{font-size:12px;color:var(--muted);font-weight:450;margin-left:6px}.issue{font-size:13px;color:#586b72;margin:0 0 12px;line-height:1.5}.next{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;padding-top:11px;font-size:12px;color:var(--green);font-weight:600}.next span:first-child:before{content:'↳';margin-right:7px}.arrow{font-size:17px}.quiet{display:flex;justify-content:space-between;align-items:center;background:#eff3f0;border-radius:12px;padding:14px;margin:17px 0 12
