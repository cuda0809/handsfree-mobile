<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2747">
<title>모바일핸즈프리</title>
<style>
:root{--nav:#0f2747;--nav2:#174872;--bg:#f4f7fb;--card:#fff;--text:#14263d;--muted:#728197;--line:#dbe5ef;--blue:#2f7dff;--red:#e65454;--amber:#f1a536;--green:#1da36b;--violet:#7257d8;--shadow:0 10px 26px rgba(26,57,91,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:82px}button,input,textarea{font:inherit}button{cursor:pointer}
.hero{color:#fff;padding:calc(15px + env(safe-area-inset-top)) 15px 24px;transition:.2s;background:linear-gradient(155deg,var(--nav),var(--nav2))}.hero.equipment{background:linear-gradient(155deg,#173c55,#20708e)}.hero.issues{background:linear-gradient(155deg,#5e2c31,#a14a43)}.hero.history{background:linear-gradient(155deg,#3d335f,#6752a2)}
.brand{display:flex;align-items:center;gap:9px}.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#2f7dff,#33d6a6)}.brand b{display:block;font-size:15px}.brand small{font-size:9px;color:#c7d8e8}.head{display:flex;justify-content:space-between;align-items:end;margin-top:17px}.head h1{margin:0 0 3px;font-size:26px}.head p{margin:0;color:#d5e0ea;font-size:11px}.head button{width:42px;height:42px;border:0;border-radius:50%;background:#ffffff17;color:#fff;font-size:22px}
.tabIntro{margin:-12px 12px 10px;padding:14px;border-radius:17px;color:#fff;box-shadow:var(--shadow);display:none}.tabIntro.show{display:block}.tabIntro small{font-size:10px;opacity:.85}.tabIntro b{display:block;font-size:16px;margin-top:3px}.tabIntro p{margin:6px 0 0;font-size:10px;opacity:.9}.tabIntro.equipment{background:linear-gradient(100deg,#235a72,#2a819b)}.tabIntro.issues{background:linear-gradient(100deg,#823b3f,#bf5b4f)}.tabIntro.history{background:linear-gradient(100deg,#54417f,#8068b6)}
.metrics{display:flex;gap:9px;overflow:auto;padding:12px;margin-top:-14px}.metrics article{min-width:145px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow)}.metrics span,.metrics small{display:block;color:var(--muted);font-size:10px}.metrics b{display:block;font-size:26px;margin:4px 0}.metrics.hide{display:none}
.focus{margin:0 12px 10px;background:linear-gradient(100deg,#173e65,#235c8e);color:#fff;padding:13px;border-radius:16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}.focus.hide{display:none}.focus div{flex:1}.focus small,.focus b{display:block}.focus small{font-size:10px;color:#bdd3e5}.focus b{font-size:13px;margin-top:3px}.focus button{border:1px solid #ffffff3a;background:#ffffff14;color:#fff;border-radius:10px;padding:8px 10px;font-size:11px}
.toolbar{margin:0 12px 10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}.toolbarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.toolbarHead b{font-size:13px}.toolbarHead small{font-size:9px;color:var(--muted)}.toolbar input{width:100%;border:1px solid var(--line);background:#f8fbfd;border-radius:11px;padding:10px;outline:0}.chips{display:flex;gap:6px;overflow:auto;margin-top:8px}.chips button,.quick button{border:1px solid var(--line);background:#fff;color:#66788e;padding:7px 10px;border-radius:999px;white-space:nowrap;font-size:11px}.chips button.active{background:#eaf2ff;border-color:#b9d4ff;color:#2468d2;font-weight:800}
.summaryStrip{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 12px 10px}.summaryStrip.show{display:grid}.summaryStrip article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.summaryStrip small{display:block;color:var(--muted);font-size:9px}.summaryStrip b{display:block;margin-top:4px;font-size:16px}
main{display:grid;gap:10px;margin:0 12px}.device{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.device.urgent{border-left:5px solid var(--red)}.device.warning{border-left:5px solid var(--amber)}.toprow{display:flex;justify-content:space-between;gap:10px}.job{font-size:10px;color:var(--muted);font-weight:800}.title{font-size:16px;font-weight:900;margin:2px 0}.sub{font-size:11px;color:var(--muted)}.grade{height:max-content;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.긴급{background:#ffebeb;color:#c43b3b}.주의{background:#fff1da;color:#9b650e}.협의{background:#eeeaff;color:#634fc4}.안정{background:#e7f8ef;color:#16784c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.box{background:#f7fafe;border-radius:11px;padding:9px}.box small{display:block;color:var(--muted);font-size:9px}.box b{font-size:11px;line-height:1.35}.reason{margin-top:8px;background:#fff8e9;border:1px solid #efdfbb;border-radius:11px;padding:9px;font-size:10px;line-height:1.4}.detail{width:100%;margin-top:10px;border:1px solid #c8d9ea;background:#fff;color:#2e6398;border-radius:11px;padding:9px;font-weight:800;font-size:11px}.historyRow{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow)}.historyRow small{color:var(--muted);font-size:9px}.historyRow b{display:block;margin:3px 0;font-size:13px}.historyRow p{margin:0;font-size:11px;color:#4d6177;line-height:1.4}
.growfloat{position:fixed;z-index:30;right:14px;bottom:83px;width:57px;height:57px;border:0;border-radius:50%;background:linear-gradient(135deg,#2f7dff,#8c5bf4);color:#fff;font-size:24px;box-shadow:0 12px 30px #396fd45c}.bottom{position:fixed;z-index:25;left:0;right:0;bottom:0;background:#fffffff4;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;color:#78889c;display:grid;place-items:center}.bottom b{font-size:19px}.bottom span{font-size:9px;margin-top:2px}.bottom .active{color:var(--blue)}
.sheet{display:none;position:fixed;z-index:60;inset:0;background:#0a1b2b77;align-items:flex-end}.sheet.show{display:flex}.sheetbox{width:100%;max-height:91vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between}.sheethead small{color:var(--blue);font-size:9px;font-weight:900}.sheethead h2{margin:3px 0 12px;font-size:20px}.sheethead button{border:0;background:#eef3f8;width:34px;height:34px;border-radius:50%;font-size:20px}.mode{padding:9px 10px;border-radius:11px;margin-bottom:9px;font-size:10px}.mode.live{background:#e8f8ef;color:#176e4a}.mode.snap{background:#fff3df;color:#87580e}.sheet textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:13px;padding:11px;resize:none;outline:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions button{border:0;border-radius:11px;padding:11px;font-weight:900;background:#eef3f8;color:#4b617a}.actions .primary{background:linear-gradient(90deg,#2f7dff,#7465f4);color:#fff}.actions .danger{background:var(--red);color:#fff}.quick{display:flex;gap:6px;overflow:auto;margin-top:9px}pre{white-space:pre-wrap;background:#f7fafe;border-radius:11px;padding:10px;min-height:42px;font:11px/1.45 inherit;color:#41546b}.confirm{background:#fff3df;color:#88580f;padding:12px;border-radius:12px;font-weight:800}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detailbox{background:#f7fafe;border-radius:11px;padding:10px}.detailbox small{display:block;color:var(--muted);font-size:9px}.detailbox b{font-size:11px}#toast{position:fixed;z-index:120;left:50%;bottom:87px;transform:translateX(-50%);background:#11263e;color:#fff;padding:9px 13px;border-radius:999px;font-size:10px;opacity:0;transition:.2s;max-width:90%;text-align:center;pointer-events:none}#toast.show{opacity:1}
@media(min-width:850px){body{padding-bottom:20px}.hero,.metrics,.focus,.toolbar,.tabIntro,.summaryStrip,main{max-width:1100px;margin-left:auto;margin-right:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;margin-top:-14px}.bottom{display:none}.growfloat{bottom:25px;right:25px}.sheet{align-items:center;justify-content:center;padding:20px}.sheetbox{max-width:620px;border-radius:24px;padding:20px}main{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header id="hero" class="hero">
 <div class="brand"><div class="logo"></div><div><b>모바일핸즈프리</b><small>Alpha 04 · Tab UI</small></div></div>
 <div class="head"><div><h1 id="pageTitle">오늘 운영현황</h1><p id="syncText">연결 확인 중…</p></div><button id="refresh">↻</button></div>
</header>

<section id="tabIntro" class="tabIntro"><small id="introSmall"></small><b id="introTitle"></b><p id="introText"></p></section>

<section id="metrics" class="metrics">
 <article><span>오늘 작업</span><b id="mToday">–</b><small>현재 공정</small></article>
 <article><span>긴급</span><b id="mUrgent">–</b><small>우선 확인</small></article>
 <article><span>주의/이슈</span><b id="mIssue">–</b><small>현재 유효</small></article>
 <article><span>타부서지원</span><b id="mSupport">–</b><small>월 누적</small></article>
</section>

<section id="focus" class="focus"><div><small>오늘 결정 필요</small><b id="focusText">운영 데이터를 읽는 중</b></div><button id="focusBtn">보기</button></section>

<section id="summaryStrip" class="summaryStrip"></section>

<section class="toolbar">
 <div class="toolbarHead"><b id="toolbarTitle">오늘 작업 빠른검색</b><small id="resultCount">0건</small></div>
 <input id="search" placeholder="발주번호 · 고객사 · 장비 검색">
 <div id="chips" class="chips"><button class="active" data-filter="all">전체</button><button data-filter="today">오늘 작업</button><button data-filter="urgent">긴급</button><button data-filter="issue">주의</button></div>
</section>

<main id="cards"></main>
<button id="growFloat" class="growfloat">🌱</button>
<nav class="bottom">
 <button class="active" data-tab="today"><b>⌂</b><span>오늘</span></button>
 <button data-tab="equipment"><b>▣</b><span>장비</span></button>
 <button data-tab="issues"><b>!</b><span>이슈</span></button>
 <button data-tab="history"><b>≡</b><span>이력</span></button>
 <button id="growNav"><b>🌱</b><span>Grow</span></button>
</nav>

<div class="sheet" id="growSheet"><div class="sheetbox">
 <div class="sheethead"><div><small>GROW COMMAND</small><h2>말하면 기록되고 바뀐다</h2></div><button data-close="growSheet">×</button></div>
 <div class="mode" id="modeBadge">연결 확인 중</div>
 <textarea id="command" placeholder="예) 미코 상태 알려줘&#10;예) 비츠로셀 AS 지원 장현준&#10;예) 한국재료연구원 전장 9/10으로 미뤄"></textarea>
 <div class="actions"><button id="voice">🎙 음성</button><button id="run" class="primary">실행</button></div>
 <div class="quick"><button data-q="오늘 생산 현황 알려줘">오늘 현황</button><button data-q="미코 상태 알려줘">미코 상태</button><button data-q="이번 주 출고 예정 알려줘">금주 출고</button></div>
 <pre id="result">명령 결과가 여기에 표시돼.</pre>
</div></div>

<div class="sheet" id="detailSheet"><div class="sheetbox">
 <div class="sheethead"><div><small id="detailJob"></small><h2 id="detailTitle"></h2></div><button data-close="detailSheet">×</button></div>
 <div id="detailBody"></div>
</div></div>

<div id="toast"></div>
<script>
let STATE={data:[],metrics:{}},TAB='today',FILTER='all',live=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function sheet(id,on=true){$('#'+id).classList.toggle('show',on)}
async function fetchJSON(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
function snapshot(){return {ok:true,mode:'snapshot',now:'2026-09-09 17:15',metrics:{todayWork:3,urgent:3,issues:9,supportEvents:4},data:[
{grade:'주의',job:'260626A-046',customer:'한국재료연구원',device:'KRM-100D2',purchase:'구매 진행 66% · 예정 08/21 경과',slack:'병행 · D-7',state:'전장 / 테스트',inspection:'검수 전 단계',shipment:'D-7 · 09/18',reason:'전장 09/07→09/09 · 전장업체 전장품 입고 지연',pm:'조나단'},
{grade:'주의',job:'LAB-260109K-004',customer:'데모기',device:'APM-20K 연속순환믹서',purchase:'자재수령 계획 없음',slack:'병행 · D-5',state:'조립 / 프로그램',inspection:'검수 전 단계',shipment:'D-5 · 09/16',reason:'자재수령 · OPEN 이슈',pm:'이기환'},
{grade:'주의',job:'260710A-052',customer:'미코',device:'KDM-150',purchase:'구매 · 일정 적합',slack:'병행 · D-33',state:'전장',inspection:'검수 전 단계',shipment:'D-33 · 10/30',reason:'82D 두께 조절 협의 · 36D 동심 수정 반출',pm:'서정완'},
{grade:'주의',job:'260708A-051',customer:'오랜드바이오',device:'PDM-300C',purchase:'구매 · 입고 지연 재확인',slack:'입고대기 · D-7',state:'오늘 계획 없음',inspection:'검수 전 단계',shipment:'D-7 · 09/18',reason:'가공/외주 · OPEN 이슈',pm:'서정완'},
{grade:'협의',job:'260601A-039-01',customer:'트루메카(대덕전자)',device:'PDM-1KV-A',purchase:'구매 완료 08/14 · 생산DB 진척 93%',slack:'자재확보',state:'오늘 계획 없음',inspection:'완성품 검수완료',shipment:'출고일 미확정',reason:'고객사 연기 / PM 협의',pm:'김재석'},
{grade:'긴급',job:'260727A-060-01',customer:'재고(SIC) → LG화학',device:'',purchase:'구매 진행 14% · 예정 09/11',slack:'입고대기 · D-13',state:'오늘 계획 없음',inspection:'검수 전 단계',shipment:'D-13 · 09/30',reason:'',pm:'조나단'},
{grade:'긴급',job:'260714A-054',customer:'코스모스랩',device:'',purchase:'구매 진행 23% · 예정 09/20',slack:'입고대기 · D-21',state:'오늘 계획 없음',inspection:'검수 전 단계',shipment:'D-21 · 10/14',reason:'',pm:'김형섭'},
{grade:'긴급',job:'260724A-059',customer:'나노실리칸첨단소재',device:'',purchase:'구매 미확정',slack:'입고대기 · D-27',state:'오늘 계획 없음',inspection:'검수 전 단계',shipment:'D-27 · 10/22',reason:'',pm:'서정완'},
{grade:'주의',job:'260728A-064',customer:'엔켓',device:'',purchase:'구매 진행 0% · 예정 09/16',slack:'입고대기 · D-15',state:'오늘 계획 없음',inspection:'검수 전 단계',shipment:'D-15 · 10/05',reason:'설계 미확정',pm:'조나단'}]}}
async function refresh(){
 $('#syncText').textContent='갱신 중…';
 try{const r=await fetchJSON('/api/dashboard',{cache:'no-store'});if(!r.ok)throw new Error();STATE=r;live=true;$('#syncText').textContent='LIVE · '+(r.now||'동기화 완료')}
 catch(e){STATE=snapshot();live=false;$('#syncText').textContent='SNAPSHOT · 모바일 미리보기'}
 const b=$('#modeBadge');b.className='mode '+(live?'live':'snap');b.textContent=live?'LIVE · 실제 HandsFree 연결됨':'SNAPSHOT · 실제 시트 쓰기 차단';render();
}
function setTab(tab){
 TAB=tab;FILTER='all';$('#search').value='';$('#search').blur();
 document.querySelectorAll('.bottom button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const hero=$('#hero'),intro=$('#tabIntro'),metrics=$('#metrics'),focus=$('#focus'),chips=$('#chips');
 hero.className='hero '+(tab==='today'?'':tab);intro.className='tabIntro';metrics.classList.toggle('hide',tab!=='today');focus.classList.toggle('hide',tab!=='today');chips.style.display=tab==='history'?'none':'flex';
 if(tab==='today'){$('#pageTitle').textContent='오늘 운영현황';$('#toolbarTitle').textContent='오늘 작업 빠른검색'}
 if(tab==='equipment'){intro.className='tabIntro equipment show';$('#pageTitle').textContent='장비 전체보기';$('#introSmall').textContent='EQUIPMENT';$('#introTitle').textContent='진행 중 장비를 한 화면에서';$('#introText').textContent='고객사 · 장비명 · 발주번호로 즉시 검색';$('#toolbarTitle').textContent='장비 검색'}
 if(tab==='issues'){intro.className='tabIntro issues show';$('#pageTitle').textContent='이슈 집중관리';$('#introSmall').textContent='ISSUE CONTROL';$('#introTitle').textContent='긴급·주의 항목만 모아보기';$('#introText').textContent='납기·구매·설계·가공 리스크를 우선 확인';$('#toolbarTitle').textContent='이슈 검색'}
 if(tab==='history'){intro.className='tabIntro history show';$('#pageTitle').textContent='최근 이력';$('#introSmall').textContent='HISTORY';$('#introTitle').textContent='최근 변경과 진행 기록';$('#introText').textContent='현재 데이터 기준 최근 상태를 시간 흐름처럼 확인';$('#toolbarTitle').textContent='이력 검색'}
 render();
}
function getRows(){
 const q=$('#search').value.trim().toLowerCase();let rows=[...(STATE.data||[])];
 if(TAB==='today')rows=rows.filter(x=>x.state&&x.state!=='오늘 계획 없음');
 if(TAB==='issues')rows=rows.filter(x=>['긴급','주의'].includes(x.grade));
 if(FILTER==='today')rows=rows.filter(x=>x.state&&x.state!=='오늘 계획 없음');
 if(FILTER==='urgent')rows=rows.filter(x=>x.grade==='긴급');
 if(FILTER==='issue')rows=rows.filter(x=>['긴급','주의'].includes(x.grade));
 if(q)rows=rows.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));
 return rows;
}
function renderSummary(rows){
 const s=$('#summaryStrip');if(TAB==='today'||TAB==='history'){s.className='summaryStrip';s.innerHTML='';return}
 const urgent=rows.filter(x=>x.grade==='긴급').length,warning=rows.filter(x=>x.grade==='주의').length,active=rows.filter(x=>x.state&&x.state!=='오늘 계획 없음').length;
 s.className='summaryStrip show';s.innerHTML=`<article><small>${TAB==='equipment'?'전체 장비':'긴급'}</small><b>${TAB==='equipment'?rows.length:urgent}</b></article><article><small>${TAB==='equipment'?'작업중':'주의'}</small><b>${TAB==='equipment'?active:warning}</b></article><article><small>${TAB==='equipment'?'이슈장비':'대상합계'}</small><b>${TAB==='equipment'?rows.filter(x=>['긴급','주의'].includes(x.grade)).length:rows.length}</b></article>`;
}
function render(){
 const m=STATE.metrics||{};$('#mToday').textContent=(m.todayWork??0)+'대';$('#mUrgent').textContent=(m.urgent??0)+'대';$('#mIssue').textContent=(m.issues??0)+'건';$('#mSupport').textContent=(m.supportEvents??0)+'건';
 const urgent=(STATE.data||[]).find(x=>x.grade==='긴급')||(STATE.data||[]).find(x=>x.grade==='주의');$('#focusText').textContent=urgent?`${urgent.customer} · ${urgent.purchase||urgent.reason||urgent.state}`:'현재 결정 필요 항목 없음';$('#focusBtn').onclick=()=>urgent&&showDetail(urgent.job);
 const rows=getRows();$('#resultCount').textContent=rows.length+'건';renderSummary(rows);
 if(TAB==='history'){
  $('#cards').innerHTML=rows.map(x=>`<article class="historyRow"><small>${esc(x.job)} · ${esc(x.grade)}</small><b>${esc(x.customer)}${x.device?' · '+esc(x.device):''}</b><p>${esc(x.state||'상태 없음')} · ${esc(x.reason||x.purchase||'최근 이슈 없음')}</p></article>`).join('')||'<article class="historyRow"><b>표시할 이력이 없어.</b></article>';return;
 }
 $('#cards').innerHTML=rows.map(x=>`<article class="device ${x.grade==='긴급'?'urgent':x.grade==='주의'?'warning':''}"><div class="toprow"><div><div class="job">${esc(x.job)}</div><div class="title">${esc(x.customer)}</div><div class="sub">${esc(x.device||'모델 미표시')}</div></div><span class="grade ${esc(x.grade)}">${esc(x.grade)}</span></div><div class="grid"><div class="box"><small>생산상태</small><b>${esc(x.state||'-')}</b></div><div class="box"><small>출고예정</small><b>${esc(x.shipment||'-')}</b></div><div class="box"><small>구매</small><b>${esc(x.purchase||'-')}</b></div><div class="box"><small>조립여유</small><b>${esc(x.slack||'-')}</b></div></div>${x.reason?`<div class="reason">${esc(x.reason)}</div>`:''}<button class="detail" data-job="${esc(x.job)}">상세 보기</button></article>`).join('')||'<article class="historyRow"><b>조건에 맞는 항목이 없어.</b></article>';
 document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>showDetail(b.dataset.job));
}
function showDetail(job){const x=(STATE.data||[]).find(r=>r.job===job);if(!x)return;$('#detailJob').textContent=x.job;$('#detailTitle').textContent=`${x.customer}${x.device?' · '+x.device:''}`;$('#detailBody').innerHTML=`<div class="detailgrid"><div class="detailbox"><small>생산상태</small><b>${esc(x.state)}</b></div><div class="detailbox"><small>출고예정</small><b>${esc(x.shipment)}</b></div><div class="detailbox"><small>구매</small><b>${esc(x.purchase)}</b></div><div class="detailbox"><small>조립여유</small><b>${esc(x.slack)}</b></div><div class="detailbox"><small>검수</small><b>${esc(x.inspection)}</b></div><div class="detailbox"><small>PM</small><b>${esc(x.pm)}</b></div></div>${x.reason?`<div class="reason">${esc(x.reason)}</div>`:''}`;sheet('detailSheet')}
function openGrow(){sheet('growSheet')}
async function runCommand(){const text=$('#command').value.trim();if(!text)return toast('명령을 입력해줘');if(!live){$('#result').textContent='현재 SNAPSHOT 모드라 실제 시트 변경은 차단되어 있어.';return}$('#result').textContent='처리 중…';try{const r=await fetchJSON('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});$('#result').textContent=r.answer||r.message||'처리 완료';await refresh()}catch(e){$('#result').textContent='처리 오류: '+e.message}}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('현재 브라우저에서 음성인식을 지원하지 않아');const r=new SR();r.lang='ko-KR';r.onresult=e=>$('#command').value=e.results[0][0].transcript;r.start()}
$('#search').oninput=render;$('#refresh').onclick=refresh;$('#growFloat').onclick=openGrow;$('#growNav').onclick=openGrow;$('#run').onclick=runCommand;$('#voice').onclick=startVoice;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>sheet(b.dataset.close,false));
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>$('#command').value=b.dataset.q);
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');FILTER=b.dataset.filter;render()});
document.querySelectorAll('.bottom button[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
refresh();
</script>
</body>
</html>
